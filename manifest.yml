app:
  id: "ari:cloud:ecosystem::app/07bbc7e7-e540-49bf-b835-6763e4aaaf3e"
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

modules:
  jira:globalPage:
    - key: portfolio-page
      resource: portfolio-ui
      resolver:
        function: resolver
      title: BPMN, Workflow Automation & Portfolio Manager for Jira
      layout: basic

  # ─── Automation Engine Triggers (Forge Syntax) ──────────────────────
  trigger:
    - key: issue-created-trigger
      function: automation-engine
      events:
        - avi:jira:created:issue
    - key: issue-updated-trigger
      function: automation-engine
      events:
        - avi:jira:updated:issue

  webtrigger:
    - key: github-webhook
      function: github-webhook-handler
      urlFormat: v2

  function:
    - key: resolver
      handler: index.handler
    - key: automation-engine
      handler: index.automationEngine
    - key: github-webhook-handler
      handler: index.handleGithubWebhook

resources:
  - key: portfolio-ui
    path: static/portfolio-ui/build

permissions:
  external:
    fetch:
      backend:
        - address: api.github.com
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - storage:app
