app:
  id: "ari:cloud:ecosystem::app/07bbc7e7-e540-49bf-b835-6763e4aaaf3e"
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

modules:
  jira:globalPage:
    - key: portfolio-page
      resource: portfolio-ui
      resolver:
        function: resolver
      title: BPMN, Workflow Automation & Portfolio Manager
      layout: basic

  function:
    - key: resolver
      handler: index.handler
    - key: automation-engine
      handler: index.automationEngine

  trigger:
    - key: automation-trigger-created
      function: automation-engine
      events:
        - avi:jira:created:issue
      filter:
        ignoreSelf: true          # ← critical: stops infinite loops when the engine itself edits issues
    - key: automation-trigger-updated
      function: automation-engine
      events:
        - avi:jira:updated:issue
      filter:
        ignoreSelf: true

resources:
  - key: portfolio-ui
    path: static/portfolio-ui/build

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - storage:app
  external:
    scripts:
      - address: "*.googletagmanager.com"
    fetch:
      backend:
        - address: "*.atlassian.net"
        - address: "*.atlassian.net"
        - address: "*.google-analytics.com"
      client:
        - address: "*.google-analytics.com"