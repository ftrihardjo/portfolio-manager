app:
  id: "ari:cloud:ecosystem::app/07bbc7e7-e540-49bf-b835-6763e4aaaf3e"
  runtime:
    name: nodejs22.x
  licensing:
    enabled: true

modules:
  jira:globalPage:
    - key: portfolio-page
      resource: portfolio-ui
      resolver:
        function: resolver
      title: BPMN, Workflow Automation & Portfolio Manager
      layout: basic

  function:
    - key: resolver
      handler: index.handler
    - key: automation-engine
      handler: index.automationEngine

  trigger:jira:issue_created:
    - key: issue-created-trigger
      function: automation-engine

  trigger:jira:issue_updated:
    - key: issue-updated-trigger
      function: automation-engine

resources:
  - key: portfolio-ui
    path: static/portfolio-ui/build

permissions:
  scopes:
    - read:jira-work
    - read:jira-user
    - write:jira-work
    - storage:app
  external:
    fetch:
      backend:
        - address: "*.atlassian.net"
